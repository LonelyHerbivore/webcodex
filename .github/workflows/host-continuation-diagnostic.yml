name: Host continuation diagnostic acceptance

on:
  push:
    branches:
      - "diagnostic/host-*"
      - "diagnostic/visible-only-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-app-contract:
    name: MCP App bridge and delivery regression
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run Host App tests
        run: node --test src/mcp_tests/agent_continuation_app.test.mjs src/mcp_tests/job_terminal_continuation_app.test.mjs src/mcp_tests/host_continuation_evidence.test.mjs
      - name: Verify diagnostic Windows PE and SHA-256 validator behavior
        run: node --test scripts/verify_orca_host_windows_artifact.test.mjs

  rust-host-contract:
    name: Rust Host/Store compile check
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check WebCodex Host and Store
        run: cargo check --locked -p webcodex -p webcodex-store --all-targets
      - name: Run Store Job terminal tests
        run: cargo test --locked -p webcodex-store job_terminal_wait
      - name: Run Orca Host intent store tests
        run: cargo test --locked -p webcodex-store orca_host_intent
      - name: Run Orca Host authorized recovery tool tests
        run: cargo test --locked -p webcodex orca_host_intent
      - name: Run Host one-call Job terminal registration and presentation tests
        run: cargo test --locked -p webcodex arm_and_present_job_terminal_continuation
      - name: Run Host persisted Worker intent authorization tests
        run: cargo test --locked -p webcodex prepare_orca_host_worker_continuation
      - name: Run Host Orca Worker Plugin Gateway launch-fence tests
        run: cargo test --locked -p webcodex start_orca_worker_with_host_intent
      - name: Run Host Orca result identity validator
        run: cargo test --locked -p webcodex confirmed_native_orca_worker_result
      - name: Run exact Orca start Plugin binding isolation tests
        run: cargo test --locked -p webcodex orca_worker_start_binding
      - name: Verify first-party Host watcher Runner Job policy and original intent fence
        run: cargo test --locked -p webcodex start_orca_host_watcher_job
      - name: Verify pinned Host/Plugin watcher identity contract
        run: cargo test --locked -p webcodex bundled_watcher_matches_plugin_first_cycle_key
      - name: Exercise bundled Node watcher with isolated Orca CLI fixtures
        run: node --test scripts/orca_host_watcher_contract.test.mjs
      - name: Verify original Host watcher Wait register, present and replay
        run: cargo test --locked -p webcodex register_orca_host_wait_and_present
      - name: Verify full Host Worker to watcher to Wait composition preflight
        run: cargo test --locked -p webcodex start_orca_worker_with_continuation

  windows-host-build:
    name: Windows Host executable and first-party watcher
    runs-on: windows-2022
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: orca-host-windows-diagnostic
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify native Windows runner architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows build runner required' }
          $rustHost = (rustc -vV | Select-String '^host: ').ToString()
          if ($rustHost -ne 'host: x86_64-pc-windows-msvc') {
            throw "Unexpected Rust host: $rustHost"
          }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw 'Checkout must exactly match GitHub source commit'
          }
          if ((git status --porcelain).Count -ne 0) { throw 'Dirty checkout before build' }
      - name: Compile native Windows WebCodex Host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked -p webcodex --bin webcodex-server
          if ($LASTEXITCODE -ne 0) { throw 'Windows Host cargo build failed' }
          $exe = 'target/debug/webcodex-server.exe'
          if (-not (Test-Path $exe)) { throw 'Windows Host binary is absent' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) {
            throw 'Host output is not a native Windows PE image'
          }
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($offset -lt 64 -or $offset -gt ($bytes.Length - 6)) { throw 'Invalid PE offset' }
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          if ($machine -ne 0x8664) { throw "Expected Windows x64 PE, got $machine" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Native WebCodex Host --version failed' }
      - name: Verify bundled watcher using Windows Node and fake Orca
        shell: pwsh
        run: |
          node --test scripts/orca_host_watcher_contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Host watcher Windows fixture failed' }
      - name: Write immutable diagnostic binary identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/debug/webcodex-server.exe'
          $out = 'target/orca-host-windows-diagnostic'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $out 'webcodex-server.exe')
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $identity = [ordered]@{
            source_repository = $env:GITHUB_REPOSITORY
            source_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            target = 'x86_64-pc-windows-msvc'
            binary = 'webcodex-server.exe'
            binary_sha256 = $hash
            purpose = 'isolated_diagnostic_only_not_signed_or_production_ready'
          }
          $identity | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $out 'manifest.json')
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'Invalid binary digest' }
      - name: Verify source-matched diagnostic artifact
        shell: pwsh
        run: |
          node --test scripts/verify_orca_host_windows_artifact.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Artifact verifier regression failed' }
          node scripts/verify_orca_host_windows_artifact.mjs target/orca-host-windows-diagnostic $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Native artifact digest or source identity mismatch' }
      - name: Upload non-release diagnostic Host binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orca-host-windows-diagnostic
          path: target/orca-host-windows-diagnostic/
          if-no-files-found: error
          retention-days: 5
