name: Host continuation diagnostic acceptance

on:
  push:
    branches:
      - "diagnostic/host-*"
      - "diagnostic/visible-only-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-app-contract:
    name: MCP App bridge and delivery regression
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run Host App tests
        run: node --test src/mcp_tests/agent_continuation_app.test.mjs src/mcp_tests/job_terminal_continuation_app.test.mjs src/mcp_tests/host_continuation_evidence.test.mjs

  rust-host-contract:
    name: Rust Host/Store compile check
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check WebCodex Host and Store
        run: cargo check --locked -p webcodex -p webcodex-store --all-targets
      - name: Run Store Job terminal tests
        run: cargo test --locked -p webcodex-store job_terminal_wait

  win-host-candidate:
    name: Exact PR6 Windows runtime trio (manual diagnostic only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      WEBCODEX_GIT_COMMIT: c2d19dc9af63e966af5509a17ebb0b568cb1731d
      WEBCODEX_GIT_DIRTY: 'false'
    steps:
      - name: Checkout exactly PR6 HEAD, not diagnostic workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c2d19dc9af63e966af5509a17ebb0b568cb1731d
          persist-credentials: false
          fetch-depth: 1
      - name: Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: pr6-host-windows-candidate
      - name: Build and verify exact Windows Host candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne $env:WEBCODEX_GIT_COMMIT) { throw "PR6 checkout SHA mismatch" }
          $builtAt = (git show -s --format=%ct HEAD).Trim()
          $env:WEBCODEX_BUILT_AT = $builtAt
          cargo build --locked --profile dogfood -p webcodex -p webcodex-cli -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "Host compile failed" }
          $version = (node -p "require('./npm/webcodex/package.json').version").Trim()
          New-Item -ItemType Directory -Path candidate | Out-Null
          $lines = @()
          foreach ($name in @('webcodex', 'webcodex-server', 'webcodex-runner')) {
            $exe = "target/dogfood/$name.exe"
            if (!(Test-Path $exe)) { throw "Missing candidate binary: $exe" }
            $actual = (& $exe --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Identity probe failed: $name" }
            $expected = "$name $version (commit $source, dirty=false, built_at=$builtAt)"
            if ($actual -ne $expected) { throw "Candidate identity mismatch: $actual" }
            Copy-Item $exe "candidate/$name.exe"
            $hash = (Get-FileHash "candidate/$name.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $name.exe"
          }
          $lines | Set-Content candidate/SHA256SUMS.txt
          "source_commit=$source" | Set-Content candidate/BUILD_ID.txt
          "built_at=$builtAt" | Add-Content candidate/BUILD_ID.txt
          "version=$version" | Add-Content candidate/BUILD_ID.txt
          Write-Output "Verified exact source identities for all three candidate executables"
      - name: Upload candidate binary for isolated testing only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr6-windows-runtime-c2d19dc9
          path: candidate/
          if-no-files-found: error
          retention-days: 3
